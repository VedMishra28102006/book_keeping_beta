<svg height="100" version="1.1" width="100" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<clipPath id="clip">
			<polygon points="0,0 50,50 100,0" />
			<polygon points="40,40 40,100 60,80 60,40" />
